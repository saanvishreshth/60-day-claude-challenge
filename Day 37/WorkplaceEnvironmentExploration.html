<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
    --text:#f1f1f6; --sub:#a9a9c8;
    --accent:#7c5cff; --accent2:#00d4ff;
    --frontend:#ff6b6b; --backend:#4ecdc4; --qa:#ffe66d; --pm:#a29bfe;
    --ux:#fd79a8; --support:#55efc4; --emgr:#fab1a0; --sales:#74b9ff; --marketing:#ffa07a;
    --good:#00e676; --shadow: 0 10px 40px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Segoe UI',system-ui,sans-serif; color:var(--text);
    background: linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));
    background-size:400% 400%;
    animation:bgshift 18s ease infinite;
    overflow-x:hidden;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  header{text-align:center; padding:32px 20px 10px;}
  header h1{
    font-size:2.6em; margin:0; letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{color:var(--sub); margin-top:6px; font-size:1.05em;}
  .container{max-width:1000px; margin:0 auto; padding:10px 20px 60px;}
  .progress-wrap{max-width:1000px; margin:20px auto 0; padding:0 20px;}
  .progress-bar{height:10px; border-radius:10px; background:rgba(255,255,255,0.08); overflow:hidden; border:1px solid var(--glass-border);}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .6s ease;}
  .stage-label{display:flex; justify-content:space-between; font-size:0.85em; color:var(--sub); margin-top:6px;}
  .glass{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:20px;
    backdrop-filter: blur(14px); box-shadow:var(--shadow);
  }
  .card-panel{padding:28px; margin-top:26px;}
  .ticket{
    padding:20px 24px; border-radius:16px; margin-bottom:22px;
    background:linear-gradient(135deg, rgba(124,92,255,0.18), rgba(0,212,255,0.10));
    border:1px solid rgba(255,255,255,0.15); position:relative;
  }
  .ticket::before{content:"🎫 TASK TICKET"; font-size:0.7em; letter-spacing:2px; color:var(--accent2); font-weight:700;}
  .ticket h2{margin:10px 0 0; font-size:1.3em; font-weight:600;}
  .role-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-top:20px;}
  .role-card{
    padding:16px 10px; text-align:center; border-radius:16px; cursor:grab; user-select:none;
    background:rgba(255,255,255,0.05); border:2px solid var(--glass-border);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    font-weight:600; font-size:0.95em;
  }
  .role-card:hover{transform:translateY(-6px) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,0.4);}
  .role-card .emoji{font-size:1.8em; display:block; margin-bottom:6px;}
  .role-card.dragging{opacity:0.4;}
  .role-card.selected{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(0,212,255,0.35);}

  .slot{
    margin-top:22px; min-height:90px; border:2px dashed var(--glass-border); border-radius:16px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:14px;
    color:var(--sub); font-weight:600; transition:all .25s ease;
  }
  .slot.hover{border-color:var(--accent2); background:rgba(0,212,255,0.08);}
  .slot.filled{border-style:solid; border-color:var(--good); color:var(--text); background:rgba(0,230,118,0.08);}

  .order-slots{display:flex; flex-wrap:wrap; gap:14px; margin-top:20px;}
  .order-slot{
    flex:1; min-width:120px; min-height:80px; border:2px dashed var(--glass-border); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; position:relative;
    color:var(--sub); font-size:0.8em; transition:all .2s ease;
  }
  .order-slot .step-num{position:absolute; top:6px; left:8px; font-size:0.75em; color:var(--accent2); font-weight:700;}
  .order-slot.hover{border-color:var(--accent2); background:rgba(0,212,255,0.08);}
  .order-slot.filled{border-style:solid; border-color:var(--good); background:rgba(0,230,118,0.08); color:var(--text);}
  .arrow{align-self:center; color:var(--sub); font-size:1.4em;}

  .multi-hint{color:var(--sub); font-size:0.9em; margin-top:6px;}
  .role-card.multi-selected{border-color:var(--good); box-shadow:0 0 0 3px rgba(0,230,118,0.35);}

  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px; padding:12px 26px;
    font-weight:700; font-size:1em; color:#0f0c29;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); color:white;
    transition:transform .15s ease, box-shadow .15s ease; margin-top:24px;
  }
  button:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(124,92,255,0.4);}
  button:disabled{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}
  button.secondary{background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--glass-border);}

  .reveal{margin-top:22px; padding:20px; border-radius:16px; background:rgba(255,255,255,0.05); border-left:4px solid var(--accent2); animation:fadeUp .5s ease;}
  .reveal h3{margin:0 0 8px; color:var(--accent2);}
  .reveal .assist{color:var(--sub); margin-top:10px; font-size:0.92em;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .flow-anim{display:flex; align-items:center; gap:8px; margin-top:20px; flex-wrap:wrap;}
  .flow-node{padding:10px 14px; border-radius:10px; background:rgba(255,255,255,0.08); font-size:0.85em; font-weight:600; opacity:0; transform:translateX(-16px);}
  .flow-node.show{animation:flowIn .5s ease forwards;}
  @keyframes flowIn{to{opacity:1; transform:translateX(0);}}
  .flow-arrow{opacity:0; color:var(--accent2); font-size:1.2em;}
  .flow-arrow.show{animation:fadeUp .4s ease forwards;}

  .charts{display:flex; flex-wrap:wrap; gap:28px; margin-top:24px;}
  .bar-row{display:flex; align-items:center; gap:12px; margin:10px 0;}
  .bar-label{width:150px; font-size:0.9em; color:var(--sub);}
  .bar-track{flex:1; height:16px; background:rgba(255,255,255,0.07); border-radius:10px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:10px; width:0%; transition:width 1.2s ease;}

  .reflection-block{margin-top:18px; padding:16px 20px; border-radius:14px; background:rgba(255,255,255,0.05);}
  .reflection-block h4{margin:0 0 6px; color:var(--accent2); font-size:1em;}

  .confetti{position:fixed; top:-20px; width:10px; height:10px; border-radius:2px; opacity:0.9; animation:fall linear forwards; z-index:999;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0;}}

  .center-btn{text-align:center;}
  .hidden{display:none !important;}
  .fade-in{animation:fadeUp .5s ease;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--glass-border); border-radius:10px;}
</style>
</head>
<body>
<header>
  <h1>🧭 Task Compass</h1>
  <p>Learn how work flows through real organizations.</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stage-label"><span id="stageText">Stage 1 · Who Owns This?</span><span id="progressText">Question 1 / 9</span></div>
</div>

<div class="container">
  <div id="game" class="glass card-panel fade-in"></div>
</div>

<script>
/* ---------------- DATA ---------------- */
const ROLES = {
  fe:{name:"Frontend Developer", emoji:"💻", color:"var(--frontend)"},
  be:{name:"Backend Developer", emoji:"🗄️", color:"var(--backend)"},
  qa:{name:"QA Engineer", emoji:"🔍", color:"var(--qa)"},
  pm:{name:"Product Manager", emoji:"📋", color:"var(--pm)"},
  ux:{name:"UX Designer", emoji:"🎨", color:"var(--ux)"},
  support:{name:"Customer Support", emoji:"🎧", color:"var(--support)"},
  emgr:{name:"Engineering Manager", emoji:"🧑‍💼", color:"var(--emgr)"},
  sales:{name:"Sales Team", emoji:"📈", color:"var(--sales)"},
  marketing:{name:"Marketing Team", emoji:"📣", color:"var(--marketing)"},
  customer:{name:"Customer", emoji:"🙋", color:"#dfe6e9"}
};

const stage1Bank = [
  {task:"A customer reports that payments fail only on iPhones.", owner:"fe", assist:["qa","be"],
   why:"The bug is device/browser-specific in the checkout UI, which is Frontend territory. QA helps reproduce it, and Backend checks if payment API responses differ."},
  {task:"The production database is returning slow query times during peak hours.", owner:"be", assist:["emgr","qa"],
   why:"Database performance and query optimization live with Backend. The Engineering Manager may prioritize the fix, and QA verifies the resolution."},
  {task:"Users say the new onboarding flow is confusing and drop off early.", owner:"ux", assist:["pm","fe"],
   why:"Confusing flows are a design problem first. UX reworks the experience, PM aligns it with goals, and Frontend implements the changes."},
  {task:"A critical security vulnerability was found in the login system.", owner:"be", assist:["emgr","qa"],
   why:"Security fixes at the authentication layer are Backend's responsibility. The Engineering Manager coordinates urgency, QA verifies the patch."},
  {task:"A customer is confused about how to cancel their subscription.", owner:"support", assist:["ux","pm"],
   why:"This is a direct customer question, so Support owns the response. If it happens often, UX and PM may simplify the cancellation flow."},
  {task:"QA finds that a new feature crashes on Android tablets only.", owner:"fe", assist:["qa"],
   why:"Platform-specific rendering issues belong to Frontend, since QA has already isolated the device scope for them to fix."},
  {task:"The product roadmap needs to be reprioritized after user feedback.", owner:"pm", assist:["ux","emgr"],
   why:"Roadmap prioritization is a Product Manager responsibility. UX and Engineering Manager weigh in on feasibility and user impact."},
  {task:"A new feature idea comes from a sales call with a big client.", owner:"pm", assist:["sales","ux"],
   why:"Turning client requests into product decisions is core PM work. Sales provides context, UX evaluates usability."},
  {task:"The mobile app's battery drain complaints are increasing.", owner:"be", assist:["fe","qa"],
   why:"Battery drain is often caused by background processes or API polling, which Backend investigates first, with Frontend checking UI-triggered calls."}
];

const stage2Bank = [
  {task:"A user reports a bug through the app's help chat.", order:["support","qa","be","pm","customer"],
   why:"Support first logs and triages the report, QA reproduces and confirms it's a real bug, Backend fixes the root cause, PM signs off on the release, and the customer is notified."},
  {task:"A customer requests a new feature for exporting reports as PDF.", order:["support","pm","ux","fe"],
   why:"Support relays the request, PM evaluates and prioritizes it, UX designs the export flow, and Frontend builds it."},
  {task:"An engineer discovers a typo in production copy on the homepage.", order:["fe","qa","emgr"],
   why:"Frontend can fix small copy issues directly, QA verifies nothing else broke, and the Engineering Manager approves the quick deploy."},
  {task:"A large client asks for a custom integration with their internal tools.", order:["sales","pm","be","qa","customer"],
   why:"Sales captures the request, PM scopes feasibility and priority, Backend builds the integration, QA tests it, then it ships to the customer."},
  {task:"Marketing wants to promote a feature that isn't fully stable yet.", order:["marketing","pm","emgr","qa"],
   why:"Marketing raises the request, PM checks whether it aligns with readiness, Engineering Manager assesses risk, and QA confirms stability before promotion."}
];

const stage3Bank = [
  {situation:"Customer satisfaction suddenly drops across the platform.",
   owner:"pm", supporting:["support","ux","qa"],
   why:"PM leads the investigation into root causes, Support surfaces real complaints, UX examines usability issues, and QA checks for lurking bugs.",
   flow:"Support → PM → UX & QA (parallel) → PM → Leadership update"},
  {situation:"Sales increase dramatically after a viral social post.",
   owner:"be", supporting:["emgr","pm","support"],
   why:"Backend must ensure systems can handle the load, Engineering Manager coordinates urgent scaling, PM tracks impact on roadmap, Support prepares for volume.",
   flow:"Sales spike → Backend (scale) → Eng Manager (coordination) → Support (readiness) → PM (monitor)"},
  {situation:"Negative reviews appear online about a recent update.",
   owner:"pm", supporting:["support","ux","marketing"],
   why:"PM owns understanding what went wrong in the update, Support gathers detailed complaints, UX assesses if the change hurt usability, Marketing manages public messaging.",
   flow:"Reviews → Support (collect) → PM (analyze) → UX (assess) → Marketing (respond)"},
  {situation:"A major feature is delayed close to its announced launch date.",
   owner:"emgr", supporting:["pm","qa","marketing"],
   why:"Engineering Manager assesses the real technical timeline, PM decides on scope trade-offs, QA confirms what's actually ready, Marketing adjusts external communication.",
   flow:"Eng Manager (assess) → PM (decide scope) → QA (verify) → Marketing (communicate)"}
];

/* ---------------- STATE ---------------- */
function shuffle(arr){let a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

const state = {
  stage:1, qIndex:0,
  s1:shuffle(stage1Bank).slice(0,3),
  s2:shuffle(stage2Bank).slice(0,3),
  s3:shuffle(stage3Bank).slice(0,3),
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  maxScores:{ownership:3, delegation:3, collaboration:3, workflow:3},
  log:{overassign:0, undercollab:0, correct:0}
};

const gameEl = document.getElementById('game');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const stageText = document.getElementById('stageText');

function updateProgress(){
  const totalQ = 9;
  const done = (state.stage-1)*3 + state.qIndex;
  progressFill.style.width = (done/totalQ*100)+'%';
  progressText.textContent = `Question ${done+1} / ${totalQ}`;
  const labels = {1:"Stage 1 · Who Owns This?", 2:"Stage 2 · Task Routing", 3:"Stage 3 · Collaboration Challenge"};
  stageText.textContent = labels[state.stage];
}

function roleCardHTML(key, draggable=true, extraClass=""){
  const r = ROLES[key];
  return `<div class="role-card ${extraClass}" draggable="${draggable}" data-role="${key}" style="border-color:${r.color}55">
    <span class="emoji">${r.emoji}</span>${r.name}
  </div>`;
}

/* ---------------- STAGE 1 ---------------- */
function renderStage1(){
  const q = state.s1[state.qIndex];
  const allRoles = Object.keys(ROLES).filter(k=>k!=='customer');
  const pool = shuffle([q.owner, ...shuffle(allRoles.filter(r=>r!==q.owner)).slice(0,5)]);

  gameEl.innerHTML = `
    <div class="ticket fade-in">
      <h2>${q.task}</h2>
    </div>
    <p style="color:var(--sub)">Drag the role that should <strong>own</strong> this task into the slot below.</p>
    <div class="slot" id="ownerSlot">Drop the owning role here</div>
    <div class="role-grid" id="roleGrid">${pool.map(k=>roleCardHTML(k)).join('')}</div>
    <div class="center-btn"><button id="submitBtn" disabled>Submit</button></div>
    <div id="revealArea"></div>
  `;

  let chosen = null;
  const slot = document.getElementById('ownerSlot');
  const submitBtn = document.getElementById('submitBtn');

  document.querySelectorAll('#roleGrid .role-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.dataset.role); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('click', ()=>{ chosen = card.dataset.role; placeInSlot(card.dataset.role); });
  });

  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('hover'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('hover'));
  slot.addEventListener('drop', e=>{
    e.preventDefault(); slot.classList.remove('hover');
    const role = e.dataTransfer.getData('text/plain');
    chosen = role; placeInSlot(role);
  });

  function placeInSlot(role){
    const r = ROLES[role];
    slot.innerHTML = `${r.emoji} <strong style="margin-left:8px">${r.name}</strong>`;
    slot.classList.add('filled');
    submitBtn.disabled = false;
  }

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    const correct = chosen === q.owner;
    if(correct){ state.scores.ownership++; state.log.correct++; }
    else { state.log.overassign += (chosen !== q.owner) ? 1:0; }
    state.scores.delegation += q.assist.includes(chosen) || correct ? 0.5 : 0;

    document.getElementById('revealArea').innerHTML = `
      <div class="reveal">
        <h3>✓ Primary Owner: ${ROLES[q.owner].emoji} ${ROLES[q.owner].name}</h3>
        <p>${q.why}</p>
        <div class="assist">🤝 May assist: ${q.assist.map(a=>ROLES[a].name).join(', ')}</div>
      </div>
      <div class="center-btn"><button id="nextBtn">Continue →</button></div>
    `;
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  });
}

/* ---------------- STAGE 2 ---------------- */
function renderStage2(){
  const q = state.s2[state.qIndex];
  const n = q.order.length;
  const allRoles = Object.keys(ROLES).filter(k=>k!=='customer');
  const pool = shuffle([...q.order.filter(r=>r!=='customer'), ...shuffle(allRoles.filter(r=>!q.order.includes(r))).slice(0,3)]);

  const slotsHTML = q.order.map((r,i)=>{
    if(r==='customer'){
      return `<div class="order-slot filled" style="opacity:0.7"><span class="step-num">${i+1}</span>🙋<br>Customer</div>`;
    }
    return `<div class="order-slot" data-index="${i}"><span class="step-num">${i+1}</span>Drop role</div>`;
  }).join(`<div class="arrow">→</div>`);

  gameEl.innerHTML = `
    <div class="ticket fade-in"><h2>${q.task}</h2></div>
    <p style="color:var(--sub)">Build the workflow — drag roles into the correct order this task should travel.</p>
    <div class="order-slots" id="orderSlots">${slotsHTML}</div>
    <div class="role-grid" id="roleGrid" style="margin-top:24px">${pool.map(k=>roleCardHTML(k)).join('')}</div>
    <div class="center-btn"><button id="submitBtn" disabled>Submit</button></div>
    <div id="revealArea"></div>
  `;

  const filled = new Array(n).fill(null);
  const slotEls = [...document.querySelectorAll('#orderSlots .order-slot[data-index]')];
  const submitBtn = document.getElementById('submitBtn');

  function checkComplete(){
    submitBtn.disabled = filled.some((v,i)=> q.order[i]!=='customer' && v===null);
  }

  document.querySelectorAll('#roleGrid .role-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.dataset.role); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });

  slotEls.forEach(slot=>{
    slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('hover'); });
    slot.addEventListener('dragleave', ()=> slot.classList.remove('hover'));
    slot.addEventListener('drop', e=>{
      e.preventDefault(); slot.classList.remove('hover');
      const role = e.dataTransfer.getData('text/plain');
      const idx = parseInt(slot.dataset.index);
      filled[idx] = role;
      const r = ROLES[role];
      slot.innerHTML = `<span class="step-num">${idx+1}</span>${r.emoji} ${r.name}`;
      slot.classList.add('filled');
      checkComplete();
    });
    // click-to-place fallback: click role then click slot
    slot.addEventListener('click', ()=>{
      const sel = document.querySelector('#roleGrid .role-card.selected');
      if(sel){
        const role = sel.dataset.role;
        const idx = parseInt(slot.dataset.index);
        filled[idx] = role;
        const r = ROLES[role];
        slot.innerHTML = `<span class="step-num">${idx+1}</span>${r.emoji} ${r.name}`;
        slot.classList.add('filled');
        sel.classList.remove('selected');
        checkComplete();
      }
    });
  });

  document.querySelectorAll('#roleGrid .role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.querySelectorAll('#roleGrid .role-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    let correctOrder = true;
    q.order.forEach((r,i)=>{ if(r!=='customer' && filled[i]!==r) correctOrder = false; });
    if(correctOrder){ state.scores.workflow++; state.log.correct++; }
    else { state.scores.workflow += 0.3; }
    state.scores.delegation += 0.5;

    document.getElementById('revealArea').innerHTML = `
      <div class="flow-anim" id="flowAnim"></div>
      <div class="reveal" style="margin-top:20px">
        <h3>Why this order works</h3>
        <p>${q.why}</p>
      </div>
      <div class="center-btn"><button id="nextBtn">Continue →</button></div>
    `;
    const flowAnim = document.getElementById('flowAnim');
    q.order.forEach((r,i)=>{
      const r_ = ROLES[r];
      const node = document.createElement('div');
      node.className = 'flow-node';
      node.style.background = 'rgba(255,255,255,0.08)';
      node.innerHTML = `${r_.emoji} ${r_.name}`;
      flowAnim.appendChild(node);
      setTimeout(()=> node.classList.add('show'), i*300);
      if(i < q.order.length-1){
        const arrow = document.createElement('div');
        arrow.className = 'flow-arrow'; arrow.textContent = '→';
        flowAnim.appendChild(arrow);
        setTimeout(()=> arrow.classList.add('show'), i*300 + 150);
      }
    });
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  });
}

/* ---------------- STAGE 3 ---------------- */
function renderStage3(){
  const q = state.s3[state.qIndex];
  const allRoles = Object.keys(ROLES).filter(k=>k!=='customer');
  const pool = shuffle(allRoles);
  let selected = new Set();

  gameEl.innerHTML = `
    <div class="ticket fade-in"><h2>⚠️ ${q.situation}</h2></div>
    <p style="color:var(--sub)">This is complex. Select <strong>up to 4</strong> roles/departments that should be involved.</p>
    <div class="multi-hint" id="hintText">Selected: 0 / 4</div>
    <div class="role-grid" id="roleGrid">${pool.map(k=>roleCardHTML(k)).join('')}</div>
    <div class="center-btn"><button id="submitBtn" disabled>Submit</button></div>
    <div id="revealArea"></div>
  `;

  const hintText = document.getElementById('hintText');
  const submitBtn = document.getElementById('submitBtn');

  document.querySelectorAll('#roleGrid .role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const role = card.dataset.role;
      if(selected.has(role)){ selected.delete(role); card.classList.remove('multi-selected'); }
      else if(selected.size < 4){ selected.add(role); card.classList.add('multi-selected'); }
      hintText.textContent = `Selected: ${selected.size} / 4`;
      submitBtn.disabled = selected.size === 0;
    });
  });

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    const chosenArr = [...selected];
    const gotOwner = chosenArr.includes(q.owner);
    const supportHits = chosenArr.filter(r=>q.supporting.includes(r)).length;

    if(gotOwner) state.scores.ownership += 0.5;
    state.scores.collaboration += Math.min(1, (chosenArr.length>=2 ? 1:0.3));
    state.scores.delegation += supportHits>0 ? 0.5 : 0;
    if(chosenArr.length <=1) state.log.undercollab++;
    if(chosenArr.length===1 && !gotOwner) state.log.overassign++;

    document.getElementById('revealArea').innerHTML = `
      <div class="reveal">
        <h3>Primary Owner: ${ROLES[q.owner].emoji} ${ROLES[q.owner].name}</h3>
        <p>${q.why}</p>
        <div class="assist">🤝 Supporting Teams: ${q.supporting.map(a=>ROLES[a].name).join(', ')}</div>
        <div class="assist">🔄 Communication Flow: ${q.flow}</div>
      </div>
      <div class="center-btn"><button id="nextBtn">Continue →</button></div>
    `;
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  });
}

/* ---------------- FLOW CONTROL ---------------- */
function nextQuestion(){
  state.qIndex++;
  if(state.qIndex >= 3){
    state.qIndex = 0;
    state.stage++;
  }
  if(state.stage > 3){
    renderResults();
    return;
  }
  updateProgress();
  render();
}

function render(){
  updateProgress();
  if(state.stage===1) renderStage1();
  else if(state.stage===2) renderStage2();
  else if(state.stage===3) renderStage3();
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  progressFill.style.width = '100%';
  progressText.textContent = 'Complete!';
  stageText.textContent = 'Reflection';

  const cats = [
    {key:'ownership', label:'Ownership', color:'var(--frontend)'},
    {key:'delegation', label:'Delegation', color:'var(--backend)'},
    {key:'collaboration', label:'Collaboration', color:'var(--ux)'},
    {key:'workflow', label:'Workflow Thinking', color:'var(--pm)'}
  ];

  const barsHTML = cats.map(c=>{
    const pct = Math.min(100, Math.round((state.scores[c.key]/state.maxScores[c.key])*100));
    return `<div class="bar-row">
      <div class="bar-label">${c.label}</div>
      <div class="bar-track"><div class="bar-fill" data-pct="${pct}" style="background:${c.color}"></div></div>
      <div style="width:40px; text-align:right; font-size:0.85em; color:var(--sub)">${pct}%</div>
    </div>`;
  }).join('');

  let strongPoint = cats.reduce((a,b)=> state.scores[a.key]/state.maxScores[a.key] > state.scores[b.key]/state.maxScores[b.key] ? a : b);
  let weakPoint = cats.reduce((a,b)=> state.scores[a.key]/state.maxScores[a.key] < state.scores[b.key]/state.maxScores[b.key] ? a : b);

  const overassignNote = state.log.overassign > 1
    ? "You sometimes leaned toward assigning a single owner to problems that likely needed a wider circle of people."
    : "You generally avoided over-assigning single ownership to complex situations — nice balance.";

  const undercollabNote = state.log.undercollab > 1
    ? "In a few multi-team situations, you tended to keep the group small — real organizational problems often benefit from a few more hands."
    : "You showed a good instinct for pulling in multiple teams when situations were genuinely complex.";

  gameEl.innerHTML = `
    <h2 style="margin-top:0">🎉 Reflection Report</h2>
    <p style="color:var(--sub)">Here's what this run revealed about how you think about work and ownership.</p>
    <div class="charts"><div style="flex:1; min-width:280px">${barsHTML}</div></div>

    <div class="reflection-block">
      <h4>✅ What you understood well</h4>
      <p>Your strongest area was <strong>${strongPoint.label}</strong> — you consistently reasoned well about this dimension of how work moves through an organization.</p>
    </div>
    <div class="reflection-block">
      <h4>⚖️ Where you tended to over-assign responsibility</h4>
      <p>${overassignNote}</p>
    </div>
    <div class="reflection-block">
      <h4>🤝 Where you underestimated collaboration</h4>
      <p>${undercollabNote}</p>
    </div>
    <div class="reflection-block">
      <h4>💡 One insight about how organizations actually work</h4>
      <p>Many real workplace problems are solved by teams rather than individuals — ownership often means coordinating people, not doing everything alone.</p>
      <p style="color:var(--sub); font-size:0.85em">Your area with the most room to grow was <strong>${weakPoint.label}</strong>, which is a great place to focus next time.</p>
    </div>
    <div class="center-btn"><button id="restartBtn">Play Again</button></div>
  `;

  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=> b.style.width = b.dataset.pct + '%');
  }, 100);

  launchConfetti();
  document.getElementById('restartBtn').addEventListener('click', ()=> location.reload());
}

function launchConfetti(){
  const colors = ['#7c5cff','#00d4ff','#ff6b6b','#4ecdc4','#ffe66d','#fd79a8'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2 + Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*0.6)+'s';
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 4500);
  }
}

/* ---------------- INIT ---------------- */
render();
</script>
</body>
</html>
