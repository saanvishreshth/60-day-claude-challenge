<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0b0e17; --panel:#141a2a; --panel2:#1b2338; --accent:#7c5cff; --accent2:#22d3ee;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24; --text:#e7e9f5; --muted:#8b93b0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #1a2140 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:24px;
  }
  h1,h2,h3{margin:0 0 8px;}
  .app{max-width:1100px; margin:0 auto;}
  header.top{text-align:center; margin-bottom:24px;}
  header.top h1{font-size:28px; background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  header.top p{color:var(--muted); margin:0;}

  .panel{background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid #2a3454;
    border-radius:var(--radius); padding:20px; margin-bottom:18px; box-shadow:0 10px 30px rgba(0,0,0,.35);}

  .hud{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center;}
  .hud .stat{background:#0f1424; border:1px solid #2a3454; border-radius:10px; padding:8px 14px; min-width:90px; text-align:center;}
  .hud .stat .num{font-size:18px; font-weight:700; color:var(--accent2);}
  .hud .stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}

  .progress-bar{height:8px; background:#0f1424; border-radius:6px; overflow:hidden; margin:14px 0;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .5s ease;}

  button{
    cursor:pointer; border:none; border-radius:10px; padding:10px 18px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0b0e17; transition:transform .15s, box-shadow .15s;
  }
  button:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(124,92,255,.4);}
  button:active{transform:translateY(0);}
  button.secondary{background:#1b2338; color:var(--text); border:1px solid #2a3454;}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

  .scenario-tag{display:inline-block; background:#0f1424; color:var(--accent2); padding:4px 10px; border-radius:20px; font-size:12px; margin-bottom:10px; border:1px solid #2a3454;}
  .desired{background:#0f1424; border-left:3px solid var(--accent2); padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; color:var(--text);}

  .blocks-zone{display:flex; flex-wrap:wrap; gap:10px; min-height:70px; padding:12px; background:#0f1424; border:2px dashed #2a3454; border-radius:12px; margin-bottom:12px;}
  .blocks-zone.over{border-color:var(--accent2); background:#111a30;}
  .block{
    background:#1b2338; border:1px solid #2a3454; border-radius:10px; padding:10px 14px; font-size:13px;
    cursor:grab; user-select:none; transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .block:hover{transform:translateY(-2px); border-color:var(--accent);}
  .block.dragging{opacity:.4;}
  .block.correct-flash{border-color:var(--good); box-shadow:0 0 12px rgba(52,211,153,.5);}
  .block.wrong-flash{border-color:var(--bad); box-shadow:0 0 12px rgba(248,113,113,.5);}
  .block.distractor-tag{border-color:var(--warn);}
  .block.remove-x{margin-left:8px; color:var(--bad); font-weight:900;}

  .zone-label{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px; margin-bottom:6px;}

  .choice-card{background:#0f1424; border:1px solid #2a3454; border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; transition:all .15s;}
  .choice-card:hover{border-color:var(--accent); transform:translateX(4px);}
  .choice-card.selected-good{border-color:var(--good); background:#0f2418;}
  .choice-card.selected-bad{border-color:var(--bad); background:#2a1414;}
  .choice-card h4{margin:0 0 6px; font-size:13px; color:var(--accent2);}
  .choice-card p{margin:0; font-size:13px; color:var(--text); line-height:1.4;}

  .hint-box{background:#0f1424; border:1px solid var(--warn); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--warn); margin-top:10px; display:none;}

  .toast{
    position:fixed; top:20px; right:20px; background:#141a2a; border:1px solid var(--accent2);
    color:var(--text); padding:12px 18px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:slideIn .3s ease, fadeOut .4s ease 2.4s forwards; z-index:999; font-size:14px;
  }
  @keyframes slideIn{from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;}}
  @keyframes fadeOut{to{opacity:0; transform:translateX(20px);}}

  .report-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:700px){.report-grid{grid-template-columns:1fr;}}
  .dna-bar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin:10px 0; border:1px solid #2a3454;}
  .dna-seg{display:flex; align-items:center; justify-content:center; font-size:10px; color:#0b0e17; font-weight:700;}

  .compare-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;}
  @media(max-width:700px){.compare-cols{grid-template-columns:1fr;}}
  .compare-col{background:#0f1424; border-radius:10px; padding:12px; border:1px solid #2a3454;}
  .compare-col h4{margin:0 0 8px; font-size:13px;}
  .compare-col.weak h4{color:var(--bad);}
  .compare-col.strong h4{color:var(--good);}
  .compare-col p{font-size:13px; line-height:1.5; margin:0;}

  code.inline{background:#0b0e17; padding:1px 6px; border-radius:5px; color:var(--accent2); font-size:12px;}

  .score-pop{position:fixed; font-weight:800; color:var(--good); font-size:20px; pointer-events:none; z-index:1000; animation:popUp 1s ease forwards;}
  @keyframes popUp{0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-50px);}}

  .rank-badge{display:inline-block; font-size:32px; margin-right:10px;}
  .final-prompt-box{background:#0f1424; border:1px solid var(--accent2); border-radius:10px; padding:14px; font-size:13px; line-height:1.6; margin-top:8px;}
  .center{text-align:center;}
  .muted{color:var(--muted); font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🧩 Prompt Puzzle</h1>
    <p>Master AI Prompting Through Play — Software / Coding · Beginner</p>
  </header>

  <div class="panel hud" id="hud">
    <div class="stat"><div class="num" id="statScenario">1/6</div><div class="lbl">Scenario</div></div>
    <div class="stat"><div class="num" id="statAccuracy">100%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="num" id="statTime">0s</div><div class="lbl">Time</div></div>
    <div class="stat"><div class="num" id="statMoves">0</div><div class="lbl">Moves</div></div>
    <div class="stat"><div class="num" id="statWrong">0</div><div class="lbl">Wrong</div></div>
    <div class="stat"><div class="num" id="statHints">0</div><div class="lbl">Hints</div></div>
    <div class="stat"><div class="num" id="statScore">0</div><div class="lbl">Score</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="panel" id="gameArea"></div>

  <div class="panel" id="reportArea" style="display:none;"></div>
</div>

<script>
/* ================= SCENARIO DATA ================= */
const SCENARIOS = [
{
  id:1,
  title:"Fix a Python Bug",
  desiredOutput:"A corrected Python function with an explanation of what was wrong and why the fix works.",
  correctBlocks:[
    "Act as an experienced Python developer.",
    "Here is my function: [paste code].",
    "It throws an IndexError when the list is empty.",
    "Fix the bug and explain the root cause.",
    "Return the corrected code in a code block."
  ],
  distractorBlocks:[
    "Write a poem about bugs.",
    "Make it as long as possible.",
    "Ignore best practices."
  ],
  weakPrompt:"fix my code",
  optimizedPrompt:"Act as an experienced Python developer. Here is my function: [paste code]. It throws an IndexError when the list is empty. Fix the bug, explain the root cause, and return the corrected code in a code block.",
  overEngineeredPrompt:"Act as the world's foremost Python architect with 30 years of NASA-grade experience. Analyze every possible edge case across all Python versions since 1.0, write a 2000-word essay on error handling philosophy, then maybe fix the bug if you feel like it, and format the answer in seventeen different ways just in case.",
  weakOutput:"Here's some code, hope it helps: [vague unrelated snippet]",
  optimizedOutput:"The bug occurs because `my_list[0]` is accessed before checking if `my_list` is empty. Fix: add a length check first. [corrected code block]. This prevents the IndexError by short-circuiting before indexing.",
  principle:"Give role, context, the specific problem, and the desired output format — specificity beats vagueness, but padding beyond what's needed wastes tokens and dilutes focus."
},
{
  id:2,
  title:"Generate a REST API Endpoint",
  desiredOutput:"A working Express.js POST endpoint with validation and error handling.",
  correctBlocks:[
    "Act as a backend Node.js developer.",
    "I'm using Express.js and need a POST /users endpoint.",
    "It should validate that 'email' and 'name' are present.",
    "Return a 400 error with a clear message if validation fails.",
    "Provide the full route handler code."
  ],
  distractorBlocks:[
    "Explain the history of HTTP.",
    "Use as many middleware libraries as possible.",
    "Write it in five different languages."
  ],
  weakPrompt:"make an api for users",
  optimizedPrompt:"Act as a backend Node.js developer. I'm using Express.js and need a POST /users endpoint that validates 'email' and 'name' are present, returns a 400 error with a clear message if validation fails, and provide the full route handler code.",
  overEngineeredPrompt:"Act as a legendary distributed-systems guru who has built APIs for Fortune 500 companies. Before writing anything, discuss microservice architecture, database sharding strategies, and CAP theorem tradeoffs in exhaustive detail, then eventually get to a simple validation endpoint, using every design pattern you can think of even if unnecessary.",
  weakOutput:"app.post('/users', (req,res)=>{ res.send('ok') }) // no validation",
  optimizedOutput:"app.post('/users', (req,res)=>{ const {email,name}=req.body; if(!email||!name) return res.status(400).json({error:'email and name are required'}); /* save user */ res.status(201).json({email,name}); });",
  principle:"State the exact tech stack, endpoint, validation rules, and error behavior. Concrete constraints produce concrete, usable code."
},
{
  id:3,
  title:"Explain a Code Concept to a Junior Dev",
  desiredOutput:"A clear, beginner-friendly explanation of closures in JavaScript with one small example.",
  correctBlocks:[
    "Act as a patient coding mentor.",
    "Explain what a closure is in JavaScript.",
    "The audience is a junior developer new to the concept.",
    "Include one short, simple code example.",
    "Keep the explanation under 150 words."
  ],
  distractorBlocks:[
    "Use as much jargon as possible.",
    "Compare it to quantum physics.",
    "Write in a formal academic tone with citations."
  ],
  weakPrompt:"what's a closure",
  optimizedPrompt:"Act as a patient coding mentor. Explain what a closure is in JavaScript to a junior developer new to the concept, include one short simple code example, and keep it under 150 words.",
  overEngineeredPrompt:"Act as a distinguished computer science professor emeritus. Provide a rigorous formal definition of closures rooted in lambda calculus, cite three academic papers, compare implementations across seven programming languages, and include a 500-line example covering every edge case before simplifying for beginners.",
  weakOutput:"A closure is a function inside a function. It's complicated, look it up.",
  optimizedOutput:"A closure is a function that 'remembers' variables from the place it was created, even after that outer function has finished running. Example: function outer(){let count=0; return function(){count++; return count;}} — the inner function keeps access to `count`.",
  principle:"Specify the audience and length constraints. Matching tone and depth to the reader is as important as the content itself."
},
{
  id:4,
  title:"Write Unit Tests",
  desiredOutput:"Jest unit tests covering normal input, edge cases, and error cases for a function.",
  correctBlocks:[
    "Act as a QA-focused software engineer.",
    "Here is the function to test: [paste function].",
    "Write unit tests using Jest.",
    "Cover normal input, edge cases, and error cases.",
    "Include descriptive test names."
  ],
  distractorBlocks:[
    "Skip edge cases to save time.",
    "Write tests in a made-up testing framework.",
    "Add unrelated performance benchmarks."
  ],
  weakPrompt:"write tests for this",
  optimizedPrompt:"Act as a QA-focused software engineer. Here is the function to test: [paste function]. Write Jest unit tests covering normal input, edge cases, and error cases, with descriptive test names.",
  overEngineeredPrompt:"Act as the head of quality assurance at a Fortune 100 company overseeing a team of 50 testers. Write an exhaustive 10,000-word test strategy document, propose a full CI/CD pipeline, discuss mutation testing philosophy, and somewhere include a few Jest tests as an afterthought.",
  weakOutput:"test('it works', ()=>{ expect(true).toBe(true) })",
  optimizedOutput:"describe('sum()', ()=>{ test('adds two positive numbers', ()=>{expect(sum(2,3)).toBe(5)}); test('handles empty input', ()=>{expect(sum()).toBe(0)}); test('throws on non-number input', ()=>{expect(()=>sum('a',1)).toThrow()}); });",
  principle:"Name the testing framework and the categories of cases you want covered — this prevents shallow, meaningless tests."
},
{
  id:5,
  title:"Refactor Messy Code",
  desiredOutput:"A cleaner, more readable version of a function with the same behavior.",
  correctBlocks:[
    "Act as a senior software engineer doing code review.",
    "Here is the function: [paste code].",
    "Refactor it for readability and maintainability.",
    "Keep the exact same behavior and inputs/outputs.",
    "Briefly explain each change you made."
  ],
  distractorBlocks:[
    "Rewrite it in a completely different language.",
    "Add unrelated new features.",
    "Make the code intentionally clever and hard to read."
  ],
  weakPrompt:"clean up this code",
  optimizedPrompt:"Act as a senior software engineer doing code review. Here is the function: [paste code]. Refactor it for readability and maintainability, keep the exact same behavior, and briefly explain each change you made.",
  overEngineeredPrompt:"Act as a code refactoring deity who has memorized every design pattern in existence. Rewrite this using at least five design patterns whether they fit or not, add abstract factory layers, introduce dependency injection frameworks, and produce a 40-page changelog.",
  weakOutput:"[same messy code with different variable names, no explanation]",
  optimizedOutput:"Renamed variables for clarity, extracted the validation logic into its own function, and removed a redundant loop. Behavior is unchanged — here's the refactored code: [clean code block].",
  principle:"Constrain refactoring to readability, not redesign — 'same behavior' prevents scope creep into unrequested rewrites."
},
{
  id:6,
  title:"Debug a Runtime Error",
  desiredOutput:"An explanation of the error's cause and a corrected code snippet.",
  correctBlocks:[
    "Act as a debugging expert.",
    "Here is my code: [paste code].",
    "Here is the exact error message: [paste error].",
    "Explain why this error is happening.",
    "Provide the corrected code."
  ],
  distractorBlocks:[
    "Guess randomly without seeing the error.",
    "Suggest rewriting the whole app from scratch.",
    "Recommend switching programming languages entirely."
  ],
  weakPrompt:"why doesn't my code work",
  optimizedPrompt:"Act as a debugging expert. Here is my code: [paste code]. Here is the exact error message: [paste error]. Explain why this is happening and provide the corrected code.",
  overEngineeredPrompt:"Act as a legendary debugging wizard summoned from the depths of Stack Overflow lore. Before answering, meditate on the history of computer science, list every possible cause of every error type in existence, then maybe get around to my actual error at the very end.",
  weakOutput:"Try restarting your computer.",
  optimizedOutput:"The error 'TypeError: undefined is not a function' happens because `data.map` is called before `data` is fetched. Fix: move the `.map()` call inside the `.then()` callback so it runs after data arrives. [corrected code].",
  principle:"Always include the exact error message and relevant code — AI can't diagnose what it can't see."
}
];

const CHALLENGE_TYPES = ["build","clean","choose"];

/* ================= STATE ================= */
let state = {
  order: [],
  current: 0,
  accuracy: 100,
  totalMoves: 0,
  wrongMoves: 0,
  hints: 0,
  score: 0,
  startTime: Date.now(),
  timerInterval: null,
  scenarioResults: [],
  currentChallenge: null,
  buildPlaced: [],
  buildPool: [],
  cleanBlocks: [],
  choiceSelected: null
};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initGame(){
  const chosen = shuffle(SCENARIOS).slice(0,6);
  state.order = chosen.map((s,i)=>({scenario:s, challenge: CHALLENGE_TYPES[i % 3] }));
  state.order = shuffle(state.order.map((o,i)=>({...o})));
  // re-cycle challenge types evenly after shuffle
  state.order.forEach((o,i)=> o.challenge = CHALLENGE_TYPES[i % 3]);
  state.current = 0;
  state.accuracy = 100;
  state.totalMoves = 0;
  state.wrongMoves = 0;
  state.hints = 0;
  state.score = 0;
  state.scenarioResults = [];
  state.startTime = Date.now();
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(updateTimer, 1000);
  document.getElementById('reportArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  renderScenario();
  updateHud();
}

function updateTimer(){
  const secs = Math.floor((Date.now()-state.startTime)/1000);
  document.getElementById('statTime').textContent = secs+'s';
}

function updateHud(){
  document.getElementById('statScenario').textContent = (state.current+1)+'/'+state.order.length;
  document.getElementById('statAccuracy').textContent = Math.round(state.accuracy)+'%';
  document.getElementById('statMoves').textContent = state.totalMoves;
  document.getElementById('statWrong').textContent = state.wrongMoves;
  document.getElementById('statHints').textContent = state.hints;
  document.getElementById('statScore').textContent = state.score;
  const pct = (state.current)/state.order.length*100;
  document.getElementById('progressFill').style.width = pct+'%';
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

function scorePop(points, x, y){
  const el = document.createElement('div');
  el.className='score-pop';
  el.textContent = (points>=0?'+':'') + points;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = points>=0 ? 'var(--good)' : 'var(--bad)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function recomputeAccuracy(){
  const total = state.totalMoves;
  const correct = total - state.wrongMoves;
  state.accuracy = total===0 ? 100 : Math.max(0,(correct/total)*100);
}

/* ================= RENDER ROUTER ================= */
function renderScenario(){
  const entry = state.order[state.current];
  state.currentChallenge = entry.challenge;
  const s = entry.scenario;
  const area = document.getElementById('gameArea');
  area.innerHTML = '';

  const tag = document.createElement('div');
  tag.className='scenario-tag';
  tag.textContent = '🧠 ' + (entry.challenge==='build'?'Build the Prompt':entry.challenge==='clean'?'Clean the Prompt':'Choose the Best Prompt') + ' · ' + s.title;
  area.appendChild(tag);

  const desired = document.createElement('div');
  desired.className='desired';
  desired.innerHTML = '<strong>🎯 Desired Output:</strong> ' + s.desiredOutput;
  area.appendChild(desired);

  if(entry.challenge==='build') renderBuild(area, s);
  else if(entry.challenge==='clean') renderClean(area, s);
  else renderChoose(area, s);

  const hintBtn = document.createElement('button');
  hintBtn.className='secondary';
  hintBtn.textContent='💡 Hint';
  hintBtn.style.marginTop='10px';
  hintBtn.onclick = ()=>showHint(s);
  area.appendChild(hintBtn);

  const hintBox = document.createElement('div');
  hintBox.className='hint-box';
  hintBox.id='hintBox';
  area.appendChild(hintBox);
}

function showHint(s){
  state.hints++;
  updateHud();
  const box = document.getElementById('hintBox');
  box.style.display='block';
  box.textContent = '💡 Principle: ' + s.principle;
}

/* ================= BUILD THE PROMPT ================= */
function renderBuild(area, s){
  state.buildPlaced = [];
  const allBlocks = shuffle([...s.correctBlocks, ...s.distractorBlocks]);
  state.buildPool = allBlocks;

  const poolLabel = document.createElement('div');
  poolLabel.className='zone-label';
  poolLabel.textContent = 'Available Blocks (drag into the prompt zone below)';
  area.appendChild(poolLabel);

  const pool = document.createElement('div');
  pool.className='blocks-zone';
  pool.id='poolZone';
  area.appendChild(pool);

  const targetLabel = document.createElement('div');
  targetLabel.className='zone-label';
  targetLabel.textContent = 'Your Prompt (drop blocks here, in order)';
  area.appendChild(targetLabel);

  const target = document.createElement('div');
  target.className='blocks-zone';
  target.id='targetZone';
  area.appendChild(target);

  allBlocks.forEach(text=>{
    pool.appendChild(makeDraggableBlock(text, s.correctBlocks.includes(text)));
  });

  [pool,target].forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('over');
      const text = e.dataTransfer.getData('text/plain');
      const dragged = document.querySelector('.block.dragging');
      if(!dragged) return;
      zone.appendChild(dragged);
      if(zone.id==='targetZone'){
        state.totalMoves++;
        const isCorrect = s.correctBlocks.includes(text);
        if(isCorrect){
          dragged.classList.add('correct-flash');
          state.score += 15;
          scorePop(15, e.clientX, e.clientY);
          toast('✅ Good block placed!');
        } else {
          dragged.classList.add('wrong-flash');
          state.wrongMoves++;
          state.score = Math.max(0, state.score - 8);
          scorePop(-8, e.clientX, e.clientY);
          toast('⚠️ That block is a distractor.');
        }
        recomputeAccuracy();
        updateHud();
        checkBuildComplete(target, s);
      }
    });
  });
}

function makeDraggableBlock(text, isCorrect){
  const b = document.createElement('div');
  b.className='block';
  b.draggable = true;
  b.textContent = text;
  b.addEventListener('dragstart', e=>{
    b.classList.add('dragging');
    e.dataTransfer.setData('text/plain', text);
  });
  b.addEventListener('dragend', ()=> b.classList.remove('dragging'));
  return b;
}

function checkBuildComplete(target, s){
  const placedTexts = Array.from(target.children).map(c=>c.textContent);
  const correctPlaced = s.correctBlocks.filter(b=>placedTexts.includes(b));
  if(correctPlaced.length === s.correctBlocks.length){
    const distractorsPlaced = placedTexts.filter(t=>s.distractorBlocks.includes(t));
    finishScenario(s, distractorsPlaced.length===0);
  }
}

/* ================= CLEAN THE PROMPT ================= */
function renderClean(area, s){
  const info = document.createElement('div');
  info.className='muted';
  info.textContent = 'This over-engineered prompt has junk in it. Click the ❌ on lines that should be removed, keeping only what\\'s essential.';
  area.appendChild(info);

  const overSentences = splitPrompt(s.overEngineeredPrompt);
  const zone = document.createElement('div');
  zone.className='blocks-zone';
  zone.style.flexDirection='column';
  zone.style.alignItems='stretch';
  area.appendChild(zone);

  const essentialCount = s.correctBlocks.length;
  let removedJunk = 0;
  let removedGood = 0;
  const totalJunk = overSentences.length - Math.min(essentialCount, overSentences.length);

  overSentences.forEach((sentence, idx)=>{
    const row = document.createElement('div');
    row.className='block';
    row.style.display='flex';
    row.style.justifyContent='space-between';
    row.style.alignItems='center';
    row.style.cursor='default';
    const isEssential = idx < essentialCount; // first N sentences approximate essential core
    row.innerHTML = '<span>'+sentence+'</span>';
    const btn = document.createElement('span');
    btn.className='remove-x';
    btn.textContent='❌';
    btn.style.cursor='pointer';
    btn.onclick = (e)=>{
      state.totalMoves++;
      if(!isEssential){
        removedJunk++;
        row.style.opacity='0.3';
        row.style.textDecoration='line-through';
        state.score += 12;
        scorePop(12, e.clientX, e.clientY);
        toast('✅ Removed unnecessary fluff!');
      } else {
        removedGood++;
        state.wrongMoves++;
        state.score = Math.max(0, state.score - 10);
        scorePop(-10, e.clientX, e.clientY);
        toast('⚠️ That part was actually essential!');
      }
      btn.style.pointerEvents='none';
      recomputeAccuracy();
      updateHud();
      if(removedJunk + removedGood >= overSentences.length - essentialCount + Math.min(1,removedGood)){
        // consider done once all junk-ish attempts made
      }
      const remainingClickable = zone.querySelectorAll('.remove-x:not([style*="pointer-events: none"])');
      if(removedJunk >= totalJunk || remainingClickable.length===0){
        setTimeout(()=> finishScenario(s, removedGood===0), 500);
      }
    };
    row.appendChild(btn);
    zone.appendChild(row);
  });
}

function splitPrompt(text){
  return text.split(/(?<=[.])\s+/).filter(x=>x.trim().length>0);
}

/* ================= CHOOSE THE BEST PROMPT ================= */
function renderChoose(area, s){
  const info = document.createElement('div');
  info.className='muted';
  info.textContent = 'Pick the prompt most likely to produce the desired output.';
  area.appendChild(info);

  const options = shuffle([
    {label:'Weak', text:s.weakPrompt, quality:'weak'},
    {label:'Optimized', text:s.optimizedPrompt, quality:'optimized'},
    {label:'Over-Engineered', text:s.overEngineeredPrompt, quality:'over'}
  ]);

  options.forEach(opt=>{
    const card = document.createElement('div');
    card.className='choice-card';
    card.innerHTML = '<h4>Option</h4><p>'+opt.text+'</p>';
    card.onclick = (e)=>{
      if(state.choiceSelected) return;
      state.choiceSelected = opt.quality;
      state.totalMoves++;
      const isBest = opt.quality==='optimized';
      if(isBest){
        card.classList.add('selected-good');
        state.score += 30;
        scorePop(30, e.clientX, e.clientY);
        toast('🏆 That\\'s the optimized prompt!');
      } else {
        card.classList.add('selected-bad');
        state.wrongMoves++;
        state.score = Math.max(0, state.score - 12);
        scorePop(-12, e.clientX, e.clientY);
        toast('⚠️ Not the best choice — check the principle.');
      }
      recomputeAccuracy();
      updateHud();
      Array.from(area.querySelectorAll('.choice-card')).forEach(c=>c.style.pointerEvents='none');
      setTimeout(()=> finishScenario(s, isBest), 700);
    };
    area.appendChild(card);
  });
  state.choiceSelected = null;
}

/* ================= SCENARIO COMPLETE ================= */
function finishScenario(s, wasOptimal){
  state.scenarioResults.push({
    title: s.title,
    challenge: state.currentChallenge,
    optimal: wasOptimal,
    principle: s.principle
  });
  if(wasOptimal){
    state.score += 20; // optimization bonus
    toast('✨ Optimization Bonus +20');
  }
  updateHud();

  setTimeout(()=>{
    state.current++;
    if(state.current >= state.order.length){
      showReport();
    } else {
      renderScenario();
      updateHud();
    }
  }, 900);
}

/* ================= REPORT ================= */
function showReport(){
  clearInterval(state.timerInterval);
  document.getElementById('gameArea').style.display='none';
  const area = document.getElementById('reportArea');
  area.style.display='block';
  document.getElementById('progressFill').style.width='100%';

  const totalSecs = Math.floor((Date.now()-state.startTime)/1000);
  const optimalCount = state.scenarioResults.filter(r=>r.optimal).length;
  const finalScore = state.score;

  let rating, rank, emoji;
  if(finalScore >= 260){rating='Prompt Master'; rank='S'; emoji='🏆';}
  else if(finalScore >= 190){rating='Prompt Expert'; rank='A'; emoji='🥇';}
  else if(finalScore >= 120){rating='Prompt Practitioner'; rank='B'; emoji='🥈';}
  else if(finalScore >= 60){rating='Prompt Apprentice'; rank='C'; emoji='🥉';}
  else {rating='Prompt Novice'; rank='D'; emoji='🌱';}

  const clarity = Math.min(100, Math.round(state.accuracy));
  const efficiency = Math.max(0, 100 - state.hints*10 - state.wrongMoves*5);
  const optimization = Math.round((optimalCount/state.order.length)*100);
  const speed = Math.max(0, 100 - Math.floor(totalSecs/6));

  const dnaData = [
    {label:'Clarity', val:clarity, color:'#22d3ee'},
    {label:'Efficiency', val:Math.max(0,Math.min(100,efficiency)), color:'#7c5cff'},
    {label:'Optimization', val:optimization, color:'#34d399'},
    {label:'Speed', val:Math.max(0,Math.min(100,speed)), color:'#fbbf24'}
  ];

  const bestPrincipleScenario = state.scenarioResults.find(r=>!r.optimal) || state.scenarioResults[0];
  const nextMilestoneScore = finalScore < 260 ? (finalScore < 190 ? 190 : 260) : 300;

  const bestFinalPromptScenario = SCENARIOS.find(s=>s.title===state.scenarioResults[0]?.title) || SCENARIOS[0];

  area.innerHTML = `
    <div class="center">
      <span class="rank-badge">${emoji}</span>
      <h2>${rating} <span class="muted">(Rank ${rank})</span></h2>
      <p class="muted">Final Prompt Score</p>
      <h1 style="font-size:48px; margin:0; color:var(--accent2);">${finalScore}</h1>
    </div>
    <div class="report-grid" style="margin-top:20px;">
      <div>
        <h3>📊 Prompt DNA</h3>
        <div class="dna-bar">
          ${dnaData.map(d=>`<div class="dna-seg" style="width:${d.val/4}%; background:${d.color};" title="${d.label}: ${d.val}">${d.val}</div>`).join('')}
        </div>
        <div class="muted">${dnaData.map(d=>d.label+': '+d.val+'%').join(' · ')}</div>
      </div>
      <div>
        <h3>📈 Session Stats</h3>
        <p class="muted">Accuracy: ${Math.round(state.accuracy)}% · Time: ${totalSecs}s · Moves: ${state.totalMoves}</p>
        <p class="muted">Wrong Placements: ${state.wrongMoves} · Hints Used: ${state.hints}</p>
        <p class="muted">Optimal Choices: ${optimalCount}/${state.order.length}</p>
      </div>
    </div>

    <div class="panel" style="margin-top:20px; background:#0f1424;">
      <h3>🎯 Personalized Feedback</h3>
      <p>${feedbackText(clarity, efficiency, optimization, state.hints)}</p>
      <p class="muted">Next milestone: reach a score of <strong>${nextMilestoneScore}</strong> to level up your rank.</p>
    </div>

    <div class="panel" style="margin-top:16px; background:#0f1424;">
      <h3>🧠 Key Principle to Remember</h3>
      <p>${bestPrincipleScenario ? bestPrincipleScenario.principle : ''}</p>
    </div>

    <div class="panel" style="margin-top:16px; background:#0f1424;">
      <h3>✅ Example Final Optimized Prompt</h3>
      <div class="compare-cols">
        <div class="compare-col weak">
          <h4>❌ Weak</h4>
          <p>${bestFinalPromptScenario.weakPrompt}</p>
        </div>
        <div class="compare-col strong">
          <h4>✅ Optimized</h4>
          <p>${bestFinalPromptScenario.optimizedPrompt}</p>
        </div>
      </div>
      <div class="final-prompt-box">${bestFinalPromptScenario.optimizedPrompt}</div>
    </div>

    <div class="center" style="margin-top:20px;">
      <button onclick="initGame()">🔁 Replay with New Scenarios</button>
    </div>
  `;
}

function feedbackText(clarity, efficiency, optimization, hints){
  let msgs = [];
  if(clarity >= 85) msgs.push('Your placement accuracy is excellent — you clearly understand what belongs in a strong prompt.');
  else if(clarity >= 60) msgs.push('Solid accuracy overall, but a few distractor blocks slipped through — review the "why" behind each essential element.');
  else msgs.push('Accuracy needs work — slow down and match each block to the desired output before placing it.');

  if(optimization >= 80) msgs.push('You consistently picked or built the optimized version over weak or over-engineered ones — great instinct for balance.');
  else msgs.push('Watch out for over-engineered prompts — more words and roles don\\'t always mean better results. Precision beats padding.');

  if(hints === 0) msgs.push('You didn\\'t need any hints this round — impressive independence!');
  else if(hints <= 2) msgs.push('You used a couple of hints, which is a great way to learn patterns quickly.');
  else msgs.push('You leaned on hints often — try predicting the principle yourself before revealing it next time.');

  return msgs.join(' ');
}

/* ================= INIT ================= */
initGame();
</script>
